    <button id="topBtn" class="btn btn-secondary"><i class="fas fa-arrow-up"></i></button>

    <script>
        $(document).ready(function () {

            $(window).scroll(function () {
                if ($(this).scrollTop() > 40) {
                    $('#topBtn').fadeIn();
                } else {
                    $('#topBtn').fadeOut();
                }
            });

            $("#topBtn").click(function () {
                $('html ,body').animate({ scrollTop: 0 }, 800);
            });                       
        });
    </script>
